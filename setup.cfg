[metadata]
name = truthlens
version = 1.0.0
description = AI-Generated Image Detection using ML & Deep Learning
author = TruthLens Team
license = MIT

[options]
packages = find:
python_requires = >=3.10

[tool:pytest]
testpaths = tests

[flake8]
max-line-length = 100
extend-ignore = E203, W503
exclude = .venv, __pycache__, *.egg-info
